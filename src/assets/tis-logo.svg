    <text x="0" y="22" font-family="'Inter', 'Playfair Display', Georgia, serif" font-size="22" font-weight="800" letter-spacing="2.5" fill="#131313">TULA&apos;S</text>
    <!-- INTERNATIONAL SCHOOL -->
